<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campus Business Network</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 text-gray-800 pt-20 pb-20">

<!-- HEADER -->
<header class="bg-gradient-to-r from-green-500 to-blue-500 text-white p-4 fixed top-0 left-0 w-full z-50 shadow-lg">

<div class="flex justify-between items-center max-w-7xl mx-auto">

<h1 class="text-xl font-bold">CBN Marketplace</h1>

<div class="flex gap-4">

<a href="index.html">Home</a>

<a href="cart.html" class="relative">
Cart
<span id="cart-count"
class="absolute -top-2 -right-3 bg-red-600 text-xs px-2 py-0.5 rounded-full">0</span>
</a>

<a href="contact.html">Contact</a>

</div>

</div>

</header>

<!-- PRODUCT SECTION -->
<main class="max-w-7xl mx-auto px-4">

<h2 class="text-2xl font-bold my-6">Products</h2>

<!-- SEARCH -->
<input
id="searchInput"
type="text"
placeholder="Search products..."
class="w-full md:w-1/2 mb-4 p-3 border rounded-lg shadow-sm">

<!-- CATEGORY FILTER -->
<select
id="categoryFilter"
class="mb-6 p-3 border rounded-lg">

<option value="all">All Categories</option>
<option value="Electronics">Electronics</option>
<option value="Clothes">Clothes</option>
<option value="Accessories">Accessories</option>
<option value="Provisions">Provisions</option>
<option value="Sneakers">Sneakers</option>
<option value="Cosmetics">Cosmetics</option>
<option value="Women`wear">Women`wear</option>

  
  
</select>

<!-- PRODUCTS -->
<div id="product-list"
class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
</div>

</main>

<!-- PRODUCT MODAL -->
<div id="productModal"
class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">

<div class="bg-white p-6 rounded-xl max-w-md w-full relative">

<button onclick="closeModal()"
class="absolute top-2 right-3 text-gray-600 text-xl">✕</button>

<img id="modalImage" class="w-full h-48 object-contain mb-4">

<h3 id="modalName" class="text-xl font-bold mb-2"></h3>

<p id="modalPrice" class="text-green-600 font-semibold mb-2"></p>

<ul id="modalSpecs"
class="text-sm text-gray-600 list-disc list-inside"></ul>

</div>

</div>

<!-- FLOATING CART -->
<a href="cart.html"
class="fixed bottom-20 right-6 bg-blue-600 text-white p-4 rounded-full shadow-xl z-50">

🛒

<span id="floating-cart-count"
class="absolute -top-2 -right-2 bg-red-600 text-xs px-2 py-0.5 rounded-full">0</span>

</a>

<!-- MOBILE NAV -->
<div class="fixed bottom-0 left-0 w-full bg-white border-t shadow-lg flex justify-around items-center py-3 z-40 md:hidden">

<a href="index.html" class="text-sm text-gray-700 text-center">
🏠<br>Home
</a>

<a href="#product-list" class="text-sm text-gray-700 text-center">
🛍<br>Products
</a>

<a href="cart.html" class="text-sm text-gray-700 text-center">
🛒<br>Cart
</a>

<a href="contact.html" class="text-sm text-gray-700 text-center">
☎<br>Contact
</a>

</div>

<script>

/* FETCH PRODUCTS */

let products = []

async function loadProducts(){

const res = await fetch("products.json")

products = await res.json()

renderProducts(products)

}

/* CART */

let cart = JSON.parse(localStorage.getItem("cbn-cart")) || []

function updateCartCount(){

const count =
cart.reduce((acc,item)=>acc+item.qty,0)

document.getElementById("cart-count").textContent=count
document.getElementById("floating-cart-count").textContent=count

}

function addToCart(id){

const product = products.find(p=>p.id===id)

const item = cart.find(p=>p.id===id)

if(item){

item.qty++

}else{

cart.push({
id:product.id,
name:product.name,
price:product.price,
vendor:product.vendor,
qty:1
})

}

localStorage.setItem("cbn-cart", JSON.stringify(cart))

updateCartCount()

}

/* IMAGE SLIDER */

let imageIndex={}

function nextImage(productId){

const product = products.find(p=>p.id===productId)

if(!imageIndex[productId]){
imageIndex[productId]=0
}

imageIndex[productId]++

if(imageIndex[productId]>=product.images.length){
imageIndex[productId]=0
}

document.getElementById("img-"+productId).src=
product.images[imageIndex[productId]]

}

function prevImage(productId){

const product = products.find(p=>p.id===productId)

if(!imageIndex[productId]){
imageIndex[productId]=0
}

imageIndex[productId]--

if(imageIndex[productId]<0){
imageIndex[productId]=product.images.length-1
}

document.getElementById("img-"+productId).src=
product.images[imageIndex[productId]]

}

/* PRODUCT MODAL */

function openProduct(product){

document.getElementById("productModal").classList.remove("hidden")

document.getElementById("modalImage").src=product.images[0]
document.getElementById("modalName").innerText=product.name
document.getElementById("modalPrice").innerText="GH₵ "+product.price

const specsList=document.getElementById("modalSpecs")
specsList.innerHTML=""

product.specs.forEach(spec=>{
const li=document.createElement("li")
li.innerText=spec
specsList.appendChild(li)
})

}

function closeModal(){
document.getElementById("productModal").classList.add("hidden")
}

/* RENDER PRODUCTS */

function renderProducts(list){

const container=document.getElementById("product-list")

container.innerHTML=""

list.forEach(product=>{

const card=document.createElement("div")

card.className="bg-white rounded-xl shadow p-4"

card.innerHTML=`

<div class="relative w-full h-48 mb-4 overflow-hidden rounded-xl">

<img src="${product.images[0]}"
id="img-${product.id}"
class="w-full h-full object-contain cursor-pointer"
onclick='openProduct(${JSON.stringify(product)})'>

<button onclick="prevImage(${product.id})"
class="absolute left-1 top-1/2 -translate-y-1/2 bg-black/40 text-white px-2 rounded">‹</button>

<button onclick="nextImage(${product.id})"
class="absolute right-1 top-1/2 -translate-y-1/2 bg-black/40 text-white px-2 rounded">›</button>

</div>

<h3 class="font-semibold">${product.name}</h3>

<p class="text-green-600 font-bold mb-2">GH₵ ${product.price}</p>

<button onclick="addToCart(${product.id})"
class="bg-blue-600 text-white w-full py-2 rounded hover:bg-blue-700">
Add to Cart
</button>

`

container.appendChild(card)

})

}

/* SEARCH */

document.getElementById("searchInput")
.addEventListener("input",function(){

const value=this.value.toLowerCase()

const filtered = products.filter(p=>
p.name.toLowerCase().includes(value) ||
p.specs.join(" ").toLowerCase().includes(value)
)

renderProducts(filtered)

})

/* CATEGORY FILTER */

document.getElementById("categoryFilter")
.addEventListener("change",function(){

const cat=this.value

if(cat==="all"){
renderProducts(products)
return
}

const filtered =
products.filter(p=>p.category===cat)

renderProducts(filtered)

})

loadProducts()
updateCartCount()

</script>

</body>
</html>
