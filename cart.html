<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - Campus Business Network</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-800">

<header class="bg-gradient-to-r from-green-500 to-blue-500 text-white p-4">
  <div class="container mx-auto flex justify-between items-center">
    <h1 class="text-2xl font-bold">Campus Business Network</h1>
    <a href="index.html" class="hover:underline font-bold">Back to Shop</a>
  </div>
</header>

<section class="container mx-auto px-4 py-10">
  <h2 class="text-2xl font-bold mb-6">Your Shopping Cart</h2>

  <div id="cart-container" class="space-y-4"></div>

  <div class="mt-6 bg-white p-6 rounded shadow">
    <div class="flex justify-between text-lg font-semibold">
      <span>Total:</span>
      <span>₵<span id="cart-total">0</span></span>
    </div>

    <div class="mt-6 flex flex-col md:flex-row gap-4">
      <button onclick="clearCart()"
        class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded w-full">
        Clear Cart
      </button>

      <a href="checkout.html"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded text-center w-full">
        Proceed to Checkout
      </a>
    </div>
  </div>
</section>

<section class="bg-yellow-100 py-6 mt-10">
  <div class="container mx-auto px-4 text-center">
    <p class="text-yellow-800 font-semibold">
      We accept offline payment. Place your order and pay on delivery!
    </p>
  </div>
</section>

<footer class="bg-gray-800 text-white py-4 mt-10">
  <div class="container mx-auto px-4 text-center">
    <p>&copy; 2026 Campus Business Network. All rights reserved.</p>
  </div>
</footer>

<script>

let cart = JSON.parse(localStorage.getItem('cbn-cart')) || [];

function saveCart() {
  localStorage.setItem('cbn-cart', JSON.stringify(cart));
}

function increaseQty(productId) {
  const item = cart.find(p => p.id === productId);
  item.qty += 1;
  saveCart();
  renderCart();
}

function decreaseQty(productId) {
  const item = cart.find(p => p.id === productId);
  if (item.qty > 1) {
    item.qty -= 1;
  } else {
    cart = cart.filter(p => p.id !== productId);
  }
  saveCart();
  renderCart();
}

function removeItem(productId) {
  cart = cart.filter(p => p.id !== productId);
  saveCart();
  renderCart();
}

function clearCart() {
  cart = [];
  saveCart();
  renderCart();
}

function renderCart() {

  const container = document.getElementById('cart-container');
  const totalDisplay = document.getElementById('cart-total');

  container.innerHTML = "";
  let total = 0;

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="bg-white p-6 rounded shadow text-center">
        Your cart is empty.
      </div>
    `;
    totalDisplay.textContent = "0";
    return;
  }

  cart.forEach(item => {

    const subtotal = item.price * item.qty;
    total += subtotal;

    const div = document.createElement('div');
    div.className = "bg-white p-4 rounded shadow flex justify-between items-center";

    div.innerHTML = `
      <div>
        <h4 class="font-semibold">${item.name}</h4>
        <p class="text-sm text-gray-500">₵${item.price} each</p>
        <p class="font-semibold mt-1">Subtotal: ₵${subtotal}</p>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="decreaseQty(${item.id})"
          class="bg-gray-300 px-3 py-1 rounded">-</button>

        <span class="font-semibold">${item.qty}</span>

        <button onclick="increaseQty(${item.id})"
          class="bg-gray-300 px-3 py-1 rounded">+</button>

        <button onclick="removeItem(${item.id})"
          class="text-red-500 ml-4 hover:underline">
          Remove
        </button>
      </div>
    `;

    container.appendChild(div);
  });

  totalDisplay.textContent = total;
}

renderCart();

</script>

</body>
</html>
